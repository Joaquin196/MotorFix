<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MotorFix - Panel de Cliente</title>
    <link rel="stylesheet" href="../style/panel_cliente.css">
</head>
<body>
    <div class="container">
        <h1>Panel de Cliente</h1>
        <div id="alerta" class="alert-message" style="display: none;"></div>

        <section>
            <h2>Mis Vehículos</h2>
            <table id="tabla-vehiculos">
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Año</th>
                    </tr>
                </thead>
                <tbody>
                     
                </tbody>
            </table>
        </section>
 
        <section>
            <h2>Solicitar Cita Previa</h2>
            <form id="formCitaCliente">
                <label for="matricula">Vehículo:</label>
                <select id="matricula" name="matricula" required>
                    
                </select>

                <label for="fecha_hora">Fecha y Hora:</label>
                <input type="datetime-local" id="fecha_hora" name="fecha_hora" required>

                <label for="motivo">Motivo / Reparación:</label>
                <textarea id="motivo" name="motivo" required></textarea>

                <button type="submit">Solicitar Cita</button>
            </form>
        </section>
    </div>

    <script src="../js/panel_cliente.js"></script>
</body>
</html>
