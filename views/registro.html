<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MotorFix - Registro</title>
    <link rel="stylesheet" href="../style/registro.css">
</head>
<body>
    <div class="auth-container">
        <h2>MotorFix</h2>
        <p class="auth-subtitle">Crea una nueva cuenta</p>
        
        // Contenedor dinámico para las alertas
        <div id="alerta" class="alert-message" style="display: none;"></div>

        // Formulario interceptado por JavaScript 
        <form id="form-registro">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" id="password" required>
            </div>
            
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <div class="auth-links">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    // Enlazamos el archivo JS independiente para el registro 
    <script src="../js/registro.js"></script>
</body>
</html>
