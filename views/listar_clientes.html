<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MotorFix - Listado de Clientes</title>
    <link rel="stylesheet" href="../style/listar_clientes.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>Panel de Clientes - MotorFix</h2>
            <a href="#" class="btn-action">+ Nuevo Cliente</a>
        </div>

        <div class="table-responsive">
            <table id="tabla-clientes">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    // Los datos se inyectarán dinámicamente mediante JavaScript 
                </tbody>
            </table>
        </div>
    </div>

    //Enlazamos el archivo JS externo 
    <script src="../js/listar_clientes.js"></script>
</body>
</html>
